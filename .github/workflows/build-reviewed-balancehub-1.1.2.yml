name: Verify BalanceHub 1.1.2 preview APK
on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - ".github/workflows/build-reviewed-balancehub-1.1.2.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Kotlin compilation, Lint and unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:compileReleaseKotlin :app:lintRelease :app:testDebugUnitTest
      - name: Validate release signing secrets and restore key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BALANCEHUB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BALANCEHUB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BALANCEHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BALANCEHUB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?}"
          : "${KEYSTORE_PASSWORD:?}"
          : "${KEY_ALIAS:?}"
          : "${KEY_PASSWORD:?}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/balancehub-upload.jks"
          chmod 600 "$RUNNER_TEMP/balancehub-upload.jks"
      - name: Build APK with original update signing
        shell: bash
        env:
          ORG_GRADLE_PROJECT_BALANCEHUB_KEYSTORE_PATH: ${{ runner.temp }}/balancehub-upload.jks
          ORG_GRADLE_PROJECT_BALANCEHUB_KEYSTORE_PASSWORD: ${{ secrets.BALANCEHUB_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BALANCEHUB_KEY_ALIAS: ${{ secrets.BALANCEHUB_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BALANCEHUB_KEY_PASSWORD: ${{ secrets.BALANCEHUB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:assembleRelease -PAPP_VERSION_CODE=250 -PAPP_VERSION_NAME=1.1.2
      - name: Verify package, version and original signing certificate
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.BALANCEHUB_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.BALANCEHUB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/signature.txt"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/package.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app'" "$RUNNER_TEMP/package.txt"
          grep -q "versionName='1.1.2'" "$RUNNER_TEMP/package.txt"
          grep -q "versionCode='250'" "$RUNNER_TEMP/package.txt"
          APK_CERT="$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          KEY_CERT="$(keytool -list -v -keystore "$RUNNER_TEMP/balancehub-upload.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | sed -n 's/.*SHA256: //p' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_CERT"
          test -n "$KEY_CERT"
          test "$APK_CERT" = "$KEY_CERT"
          cp "$APK" BalanceHub-1.1.2.apk
          sha256sum BalanceHub-1.1.2.apk
      - name: Upload verified update APK
        uses: actions/upload-artifact@v4
        with:
          name: BalanceHub-1.1.2
          path: BalanceHub-1.1.2.apk
          if-no-files-found: error
          retention-days: 30
