name: Build BalanceHub update APK

on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/balancehub-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Intermediate pushes in a large approved feature update should not use
# runner time or produce noisy notifications from obsolete APK attempts.
concurrency:
  # Keep a hung old commit from blocking a new test build. Repeated
  # attempts of the same revision still supersede one another.
  group: balancehub-apk-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BALANCEHUB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BALANCEHUB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BALANCEHUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BALANCEHUB_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for BalanceHub release signing: $name"
              exit 1
            fi
          done

      - name: Restore private release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BALANCEHUB_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/balancehub-upload.jks"
          chmod 600 "$RUNNER_TEMP/balancehub-upload.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run automated checks before release build
        shell: bash
        run: |
          set -euo pipefail
          if ! ./gradlew --no-daemon --console=plain :app:compileReleaseKotlin :app:lintRelease :app:testDebugUnitTest; then
            REPORT="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
            if [ -f "$REPORT" ]; then
              echo "::group::Full Android Lint report"
              cat "$REPORT"
              echo "::endgroup::"
            fi
            exit 1
          fi

      - name: Upload Lint diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: BalanceHub-lint-report
          path: |
            app/build/reports/lint-results-release.html
            app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: ignore

      # Previous approved 1.1.2 preview used versionCode 250; keep every update above it.
      - name: Build signed release APK (retry transient Maven errors)
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt of 4"
            if ./gradlew --no-daemon --console=plain :app:assembleRelease \
              -PAPP_VERSION_CODE=$(( ${{ github.run_number }} + 300 )) \
              -PAPP_VERSION_NAME=1.1.3-rc1 2>&1 | tee "$RUNNER_TEMP/balancehub-build.log"; then
              exit 0
            fi
            if grep -Eq "Compilation error|Unresolved reference|Too many arguments|e: file://" "$RUNNER_TEMP/balancehub-build.log"; then
              echo "::error::Kotlin compilation failed; skipping retries because code errors are not transient"
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Gradle build failed after four attempts"
              exit 1
            fi
            delay=$((attempt * 45))
            echo "Retrying after ${delay}s (transient dependency or network errors)"
            sleep "$delay"
          done
        env:
          ORG_GRADLE_PROJECT_BALANCEHUB_KEYSTORE_PATH: ${{ runner.temp }}/balancehub-upload.jks
          ORG_GRADLE_PROJECT_BALANCEHUB_KEYSTORE_PASSWORD: ${{ secrets.BALANCEHUB_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BALANCEHUB_KEY_ALIAS: ${{ secrets.BALANCEHUB_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BALANCEHUB_KEY_PASSWORD: ${{ secrets.BALANCEHUB_KEY_PASSWORD }}

      - name: Verify signed APK and signing certificate
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.BALANCEHUB_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.BALANCEHUB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/balancehub-signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/balancehub-signature.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/balancehub-package-info.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app'" "$RUNNER_TEMP/balancehub-package-info.txt"
          grep -q "versionCode='$(( ${{ github.run_number }} + 300 ))'" "$RUNNER_TEMP/balancehub-package-info.txt"
          grep -q "versionName='1.1.3-rc1'" "$RUNNER_TEMP/balancehub-package-info.txt"
          APK_SHA="$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' "$RUNNER_TEMP/balancehub-signature.txt" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          keytool -list -v -keystore "$RUNNER_TEMP/balancehub-upload.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/balancehub-keystore-info.txt"
          KEY_SHA="$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/balancehub-keystore-info.txt" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$APK_SHA" ] || [ -z "$KEY_SHA" ] || [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::APK signer fingerprint is missing or does not match the release keystore"
            exit 1
          fi
          echo "APK signing certificate SHA-256 verified: $APK_SHA"

      - name: Rename APK to BalanceHub.apk
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/BalanceHub.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BalanceHub
          path: app/build/outputs/apk/release/BalanceHub.apk
          if-no-files-found: error
          retention-days: 30

      # Release publication is deliberately separate from CI. The owner must
      # approve the final changelog and version before any GitHub Release.

      - name: Notify build result in GitHub issue
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const resultText = status === 'success' ? '✅ APK собран и проверки пройдены' : status === 'cancelled' ? '⚪ Сборка отменена' : '❌ Ошибка сборки APK';
            const body = [
              '@RussoTurissto',
              `**${resultText}**`,
              `Запуск: ${runUrl}`,
              `Коммит: \`${context.sha.slice(0, 12)}\``,
              status === 'success' ? `APK для проверки находится в артефактах запуска GitHub Actions. Релиз не опубликован.` : 'Диагностика: откройте журнал неуспешного шага сборки.',
              'Автоматический журнал: этот комментарий создаёт GitHub Actions сразу после завершения запуска.'
            ].join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
