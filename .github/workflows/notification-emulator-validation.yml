name: Validate notification sound and vibration on Android emulators

on:
  push:
    branches:
      - main
      - feature/balancehub-foundation
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - "gradle.properties"
      - "scripts/ci-emulator-validation.sh"
      - ".github/workflows/notification-emulator-validation.yml"
      - "library-android/src/main/**"
      - "library-compose/src/main/**"
      - "library-kotlin/src/main/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - "gradle.properties"
      - "scripts/ci-emulator-validation.sh"
      - ".github/workflows/notification-emulator-validation.yml"
      - "library-android/src/main/**"
      - "library-compose/src/main/**"
      - "library-kotlin/src/main/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balancehub-emulators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulators:
    name: "Android API ${{ matrix.api }}"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Validate RC numbering, stable approval and publication script syntax
        if: matrix.api == 29
        run: bash scripts/test-release-versioning.sh
      - name: Run JVM regression tests
        if: matrix.api == 29
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest
      - name: Check release Lint before merging RC changes
        if: matrix.api == 29
        shell: bash
        run: |
          set -euo pipefail
          # Maven Central may temporarily return 429 during parallel emulator
          # startup. Back off without forcing dependency refreshes.
          for attempt in 1 2 3 4 5; do
            echo "Release Lint attempt $attempt of 5"
            gradle_args=(--no-daemon --console=plain)
            if ./gradlew "${gradle_args[@]}" :app:lintRelease 2>&1 | tee "$RUNNER_TEMP/balancehub-release-lint.log"; then
              exit 0
            fi
            if ! grep -Eqi 'Could not resolve all (files|artifacts)|Could not find [[:alnum:]_.-]+:[[:alnum:]_.-]+:|Could not (GET|HEAD)|Read timed out|Connection reset|Temporary failure in name resolution|Too Many Requests|status code 429' "$RUNNER_TEMP/balancehub-release-lint.log"; then
              echo "::error::Release Lint failed for a non-dependency reason; not retrying"
              exit 1
            fi
            if (( attempt == 5 )); then
              echo "::error::Release Lint dependencies unavailable after five attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done
      # Keep Gradle/Kotlin compilation away from the running Android VM:
      # concurrent dexing + emulator snapshots can exhaust hosted-runner memory.
      - name: Prebuild test APKs before starting the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Prebuild Android instrumentation attempt $attempt of 3"
            if ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest; then
              exit 0
            fi
            if (( attempt == 3 )); then
              echo "::error::Could not prebuild Android test APKs"
              exit 1
            fi
            sleep $((attempt * 30))
          done
      - name: Execute instrumented Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: ${{ (matrix.api == 35 || matrix.api == 36) && '3072M' || '2048M' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            bash scripts/ci-emulator-validation.sh "${{ matrix.api }}"
            adb shell dumpsys notification --noredact | grep -E 'balancehub\\.channel|content://.*sounds|vibration' | head -n 80 || true
      - name: Upload Android test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-emulator-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            app/build/winter-previews/**
            app/build/emulator-focus-retry/**
          if-no-files-found: ignore
