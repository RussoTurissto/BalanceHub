name: Validate notification sound and vibration on Android emulators

on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - ".github/workflows/notification-emulator-validation.yml"
      - "app/src/main/**"
      - "app/src/androidTest/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balancehub-emulators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulators:
    name: "Android API ${{ matrix.api }}"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Execute instrumented Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
            adb shell dumpsys notification --noredact | grep -E 'balancehub\\.channel|content://.*sounds|vibration' | head -n 80 || true
      - name: Upload Android test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-emulator-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
