name: Build isolated BalanceHub Test and publish preview update
on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - ".github/scripts/preview_keystore.py"
      - ".github/workflows/balancehub-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balancehub-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Derive stable test-only signing certificate from secret entropy
        env:
          BALANCEHUB_KEYSTORE_BASE64: ${{ secrets.BALANCEHUB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 -m pip install --user 'pycryptodome==3.23.0' 'cryptography==46.0.2'
          python3 .github/scripts/preview_keystore.py
      - name: Compile, lint and run tests
        run: ./gradlew --no-daemon --console=plain :app:compilePreviewKotlin :app:lintPreview :app:testDebugUnitTest
      - name: Build signed test APK
        env:
          ORG_GRADLE_PROJECT_BALANCEHUB_PREVIEW_KEYSTORE_PATH: ${{ runner.temp }}/balancehub-preview.p12
        run: |
          ./gradlew --no-daemon --console=plain :app:assemblePreview \
            -PAPP_VERSION_CODE=${{ github.run_number }} -PAPP_VERSION_NAME=1.1.0
      - name: Verify isolated package, version, and signing identity
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.BALANCEHUB_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.BALANCEHUB_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BALANCEHUB_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/preview/app-preview.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/preview-signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/preview-signature.txt"
          "$BT/aapt" dump badging "$APK" > "$RUNNER_TEMP/preview-package.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app.test'" "$RUNNER_TEMP/preview-package.txt"
          grep -q "versionCode='${{ github.run_number }}'" "$RUNNER_TEMP/preview-package.txt"
          grep -q "versionName='1.1.0-test'" "$RUNNER_TEMP/preview-package.txt"
          echo "$RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE_SHA="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$RELEASE_KEY_ALIAS" -storepass "$RELEASE_STORE_PASSWORD" | sed -n 's/.*SHA256: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          PREVIEW_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/preview-signature.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$PREVIEW_SHA" ] || [ -z "$RELEASE_SHA" ] || [ "$PREVIEW_SHA" = "$RELEASE_SHA" ]; then
            echo "::error::Preview signer missing or matching production"; exit 1
          fi
          echo "Separate signing certificates verified"
          cp "$APK" BalanceHub-Test.apk
          sha256sum BalanceHub-Test.apk
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: BalanceHub-Test
          path: BalanceHub-Test.apk
          retention-days: 30
      - name: Publish isolated test prerelease for OTA update tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.1.0-test.${{ github.run_number }}"
          printf 'Только для BalanceHub Test. Не обновляет обычный BalanceHub.\n\n<!-- BalanceHub-VersionCode: %s -->\n' "${{ github.run_number }}" > "$RUNNER_TEMP/notes.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BalanceHub-Test.apk --clobber
          else
            gh release create "$TAG" BalanceHub-Test.apk --prerelease \
              --target "$GITHUB_SHA" --title "BalanceHub Test ${{ github.run_number }}" \
              --notes-file "$RUNNER_TEMP/notes.txt"
          fi
