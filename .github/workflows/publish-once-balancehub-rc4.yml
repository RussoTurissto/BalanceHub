name: Publish approved BalanceHub 1.1.3-rc4 APK

on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - ".github/workflows/publish-once-balancehub-rc4.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.repository == 'RussoTurissto/BalanceHub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "43491610826"
      SOURCE_SHA: "e3dd60df6c21d05e7a9d6a9127736981c821900b"
      TAG: "v1.1.3-rc4"
      VERSION: "1.1.3-rc4"
      CODE: "567"
    steps:
      - name: Checkout release notes workspace
        uses: actions/checkout@v4
      - name: Wait for approved checks and retrieve signed APK
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          if [[ "$state" != success || "$sha" != "$SOURCE_SHA" ]]; then
            echo "::error::The approved source build did not pass or its SHA changed"
            exit 1
          fi
          mkdir -p dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name BalanceHub --dir dist
          test -s dist/BalanceHub.apk
      - name: Verify APK version package signature and update compatibility
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs dist/BalanceHub.apk | tee "$RUNNER_TEMP/current-signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/current-signature.txt"
          "$tools/aapt" dump badging dist/BalanceHub.apk | tee "$RUNNER_TEMP/package.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app'" "$RUNNER_TEMP/package.txt"
          grep -q "versionName='$VERSION'" "$RUNNER_TEMP/package.txt"
          grep -q "versionCode='$CODE'" "$RUNNER_TEMP/package.txt"
          mkdir -p previous
          gh release download v1.1.3-rc3-build554 --repo "$GITHUB_REPOSITORY" --pattern BalanceHub.apk --dir previous
          "$tools/apksigner" verify --verbose --print-certs previous/BalanceHub.apk > "$RUNNER_TEMP/previous-signature.txt"
          current="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/current-signature.txt" | tr -d '[:space:]:')"
          previous="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/previous-signature.txt" | tr -d '[:space:]:')"
          if [[ -z "$current" || "$current" != "$previous" ]]; then
            echo "::error::APK signer differs from previously published BalanceHub update key"
            exit 1
          fi
          echo "Update signing identity matches published build 554"
          sha256sum dist/BalanceHub.apk
      - name: Publish public direct-download APK release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite"
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## BalanceHub 1.1.3-rc4 — звуки, вибрация и отступы

          - Расстояние «Предстоящие события → Архив событий» соответствует платежам: 14 dp.
          - Включение вибрации не зависит от доступности WAV-мелодии.
          - Исправлено чтение встроенных WAV-файлов, добавлен резервный способ передачи звука Android.
          - В диагностике отображаются причины ошибок чтения звука.
          - Подготовлены инструментальные тесты чтения 15 мелодий.
          - Компиляция, Android Lint, модульные тесты, компиляция Android-тестов и подпись APK проверены в GitHub Actions.

          Установите BalanceHub.apk поверх текущей версии **без удаления приложения**. Никакие платёжные или событийные данные удалять не нужно.

          Реальное звучание и вибрация зависят также от режима телефона, разрешений и настроек каналов Android. На телефоне рекомендуется отправить тестовое уведомление каждого типа.
          NOTES
          gh release create "$TAG" "dist/BalanceHub.apk#BalanceHub.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "BalanceHub 1.1.3-rc4 — уведомления и отступы" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BalanceHub.apk" >> "$GITHUB_STEP_SUMMARY"
