name: Convert BalanceHub test releases to private drafts

on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - ".github/workflows/balancehub-private-prerelease-migration.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: balancehub-private-prerelease-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.repository == 'RussoTurissto/BalanceHub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RC6_TAG: v1.1.4-rc6
      RC6_RUN: "43624762976"
      RC6_SHA: b19b2f23ba7ae3243dd653064c5b6d62a3c16661
      EMULATOR_RUN: "43624756101"
      EMULATOR_SHA: d0a550d060cc1c63e9f073e2dce65f981ee86f41
    steps:
      - name: Check out approved source and release notes
        uses: actions/checkout@v4

      - name: Convert all published prereleases to unpublished drafts
        shell: bash
        run: |
          set -euo pipefail
          echo "Fetching all repository releases, including drafts"
          mapfile -t rows < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease == true and .draft == false) | [.id, .tag_name] | @tsv')
          echo "Published prereleases found: ${#rows[@]}"
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r id tag <<< "$row"
            echo "Converting $tag (release ID $id) to draft"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F draft=true -F prerelease=true \
              --jq '{tag_name, draft, prerelease}'
          done
          remaining="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.prerelease == true and .draft == false)] | length' \
            | awk '{total += $1} END {print total+0}')"
          if [[ "$remaining" -ne 0 ]]; then
            echo "::error::$remaining published prereleases remain visible"
            exit 1
          fi
          echo "All existing prereleases are unpublished drafts."

      - name: Check approved signed build and emulator jobs
        shell: bash
        run: |
          set -euo pipefail
          for run in "$RC6_RUN" "$EMULATOR_RUN"; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)"
            branch="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_branch)"
            expected="$RC6_SHA"
            if [[ "$run" == "$EMULATOR_RUN" ]]; then expected="$EMULATOR_SHA"; fi
            if [[ "$conclusion" != success || "$sha" != "$expected" ||
                  "$branch" != "feature/balancehub-foundation" ]]; then
              echo "::error::Unapproved or incomplete run: $run"
              exit 1
            fi
          done
          checks="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EMULATOR_RUN/jobs?per_page=20" \
            --jq '[.jobs[] | select(.name | startswith("Android API")) | (.name + ":" + .conclusion)] | sort | join(",")')"
          [[ "$checks" == "Android API 29:success,Android API 35:success,Android API 36:success" ]] || {
            echo "::error::Emulator tests have not all passed: $checks"; exit 1;
          }
          delta="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EMULATOR_SHA...$RC6_SHA" \
            --jq '[.files[].filename] | sort | join(",")')"
          [[ "$delta" == ".github/workflows/balancehub-apk.yml,gradle.properties" ]] || {
            echo "::error::Android source differs from tested version: $delta"; exit 1;
          }

      - name: Download and verify rc6 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RC6_RUN" --repo "$GITHUB_REPOSITORY" \
            --name BalanceHub --dir dist
          test -s dist/BalanceHub.apk
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose dist/BalanceHub.apk
          "$tools/aapt" dump badging dist/BalanceHub.apk > "$RUNNER_TEMP/app-info.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app'" "$RUNNER_TEMP/app-info.txt"
          grep -q "versionName='1.1.4-rc6'" "$RUNNER_TEMP/app-info.txt"
          grep -q "versionCode='640'" "$RUNNER_TEMP/app-info.txt"
          sha256sum dist/BalanceHub.apk

      - name: Create pinned-by-title CURRENT rc6 draft with verified APK
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v1.1.4-rc6") | .id' | head -n1)"
          if [[ -n "$existing" ]]; then
            echo "Existing rc6 release ID $existing; checking draft flags"
            gh api "repos/$GITHUB_REPOSITORY/releases/$existing" \
              --jq '{tag_name,draft,prerelease,assets:[.assets[].name]}'
            draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$existing" --jq .draft)"
            [[ "$draft" == true ]] || { echo "::error::rc6 must not be public"; exit 1; }
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$existing" --jq '[.assets[].name] | index("BalanceHub.apk") != null')" != true ]]; then
              echo "::error::Existing rc6 draft has no APK"; exit 1
            fi
          else
            gh release create "$RC6_TAG" "dist/BalanceHub.apk#BalanceHub.apk" \
              --repo "$GITHUB_REPOSITORY" --target "$RC6_SHA" \
              --title "★ АКТУАЛЬНАЯ ТЕСТОВАЯ · BalanceHub 1.1.4-rc6" \
              --notes-file release/notes-1.1.4-rc6.md \
              --draft --prerelease --latest=false
          fi
          # A GitHub Draft cannot use the GitHub "Latest" badge. Keep a single
          # visibly named current draft for collaborators instead.
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == "v1.1.4-rc6") | {tag_name,draft,prerelease,name}'
          echo "Draft rc6: https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
