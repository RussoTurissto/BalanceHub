name: Publish approved BalanceHub APK

# A release is initiated only by a deliberately committed approval manifest.
on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - "release/approved.json"

permissions:
  actions: read
  contents: write

concurrency:
  group: balancehub-approved-prerelease
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'RussoTurissto/BalanceHub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout approval and release notes
        uses: actions/checkout@v4

      - name: Verify approved CI run and fetch signed APK
        shell: bash
        run: |
          set -euo pipefail
          data=release/approved.json
          tag="$(jq -er '.tag' "$data")"
          run="$(jq -er '.run_id' "$data")"
          sha="$(jq -er '.commit_sha' "$data")"
          version="$(jq -er '.version_name' "$data")"
          code="$(jq -er '.version_code' "$data")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]
          [[ "$run" =~ ^[0-9]+$ ]]
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          [[ "$tag" == "v$version" ]]
          source_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)"
          source_branch="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_branch)"
          if [[ "$source_state" != "success" ||
                "$source_sha" != "$sha" ||
                "$source_branch" != "feature/balancehub-foundation" ]]; then
            echo "::error::Approved CI run does not match the signed source"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to replace an existing GitHub release"
            exit 1
          fi
          mkdir -p dist
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name BalanceHub --dir dist
          test -s dist/BalanceHub.apk
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CODE=$code" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"

      - name: Verify APK signature, package name and version
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs dist/BalanceHub.apk \
            | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            "$RUNNER_TEMP/signature.txt"
          "$tools/aapt" dump badging dist/BalanceHub.apk \
            | tee "$RUNNER_TEMP/package.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app'" \
            "$RUNNER_TEMP/package.txt"
          grep -q "versionName='$VERSION'" "$RUNNER_TEMP/package.txt"
          grep -q "versionCode='$CODE'" "$RUNNER_TEMP/package.txt"
          sha256sum dist/BalanceHub.apk

      - name: Create release tag before the release API request
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$SOURCE_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish a direct-APK GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          test -s release/notes.md
          gh release create "$TAG" "dist/BalanceHub.apk#BalanceHub.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "BalanceHub $VERSION — предрелиз" \
            --notes-file release/notes.md --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,isDraft,isPrerelease,assets
