name: Publish verified BalanceHub 1.1.3-rc6 APK

on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - ".github/workflows/publish-once-balancehub-rc6.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.repository == 'RussoTurissto/BalanceHub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "43517544956"
      SOURCE_SHA: "5578cce0338c6cae0195ff122e1eca7e7a22ee6f"
      EMULATOR_RUN: "43517550123"
      EMULATOR_SHA: "adc0d37324414e6ead862f9d44ec51210c3e131e"
      TAG: "v1.1.3-rc6"
      VERSION: "1.1.3-rc6"
      CODE: "584"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for signed build and emulator API 29 35 36 checks
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run watch "$EMULATOR_RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          source_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)"
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          emu_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EMULATOR_RUN" --jq .conclusion)"
          emu_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EMULATOR_RUN" --jq .head_sha)"
          if [[ "$source_state" != success || "$source_sha" != "$SOURCE_SHA" ||
                "$emu_state" != success || "$emu_sha" != "$EMULATOR_SHA" ]]; then
            echo "::error::Release source APK or emulator verification did not pass"
            exit 1
          fi
          platforms="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EMULATOR_RUN/jobs?per_page=20" \
            --jq '[.jobs[] | select(.name | startswith("Android API")) | .conclusion] | sort | join(",")')"
          if [[ "$platforms" != "success,success,success" ]]; then
            echo "::error::Expected passing Android 10/15/16 emulator tests, received $platforms"
            exit 1
          fi
          mkdir -p dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name BalanceHub --dir dist
          test -s dist/BalanceHub.apk
      - name: Verify APK version, v2 signing and existing update key
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs dist/BalanceHub.apk \
            | tee "$RUNNER_TEMP/current-signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            "$RUNNER_TEMP/current-signature.txt"
          "$tools/aapt" dump badging dist/BalanceHub.apk | tee "$RUNNER_TEMP/package.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app'" \
            "$RUNNER_TEMP/package.txt"
          grep -q "versionName='$VERSION'" "$RUNNER_TEMP/package.txt"
          grep -q "versionCode='$CODE'" "$RUNNER_TEMP/package.txt"
          mkdir -p previous
          curl -fLsS --retry 3 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/apk-downloads/v1.1.3-rc5/BalanceHub.apk" \
            -o previous/BalanceHub.apk
          test -s previous/BalanceHub.apk
          "$tools/apksigner" verify --verbose --print-certs previous/BalanceHub.apk \
            > "$RUNNER_TEMP/previous-signature.txt"
          current="$(sed -n -E 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' \
            "$RUNNER_TEMP/current-signature.txt" | head -n 1)"
          previous="$(sed -n -E 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' \
            "$RUNNER_TEMP/previous-signature.txt" | head -n 1)"
          if [[ -z "$current" || "$current" != "$previous" ]]; then
            echo "::error::Signing certificate mismatch: APK would not install as update"
            exit 1
          fi
          echo "Signed update compatible with previous BalanceHub verified."
          sha256sum dist/BalanceHub.apk
      - name: Publish tested APK directly on GitHub
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          # BalanceHub 1.1.3-rc6 — системные звуки и вибрация

          - Встроенные WAV-мелодии теперь доступны через стабильные адреса в системной медиатеке Android
          - Уведомления используют выбранный внутри BalanceHub звук и платформенную вибрацию
          - Повторное изменение не создаёт новый канал, когда параметры уже совпадают
          - Android-категории «Обновления», «Платежи», «События» сохранены
          - Перестали сообщать об успехе до проверки фактических параметров Android
          - Инструментальные тесты всех 15 звуков, сохранения каналов, реальных уведомлений и внешнего доступа к URI проверены на Android 10/15/16 (API 29/35/36)
          - Проверены сборка, Android Lint, модульные тесты, подпись и совместимость с предшествующей APK

          **Важно:** проверить физический динамик/вибромотор и особенности оболочки ColorOS можно только на самом телефоне. Не удаляйте текущую версию: установите APK поверх неё. Системные режимы без звука и «Не беспокоить» сохраняют приоритет.

          Для ранее беззвучных каналов подтвердите «Включить звук и вибрацию» в настройках BalanceHub и отправьте тестовое уведомление.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite an existing release"
            exit 1
          fi
          if gh release create "$TAG" "dist/BalanceHub.apk#BalanceHub.apk" \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "BalanceHub 1.1.3-rc6 — системные уведомления" \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false; then
            echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BalanceHub.apk" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release API denied GITHUB_TOKEN. Publishing verified APK on public downloads branch."
            cp dist/BalanceHub.apk "$RUNNER_TEMP/BalanceHub.apk"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git ls-remote --exit-code --heads origin apk-downloads >/dev/null 2>&1; then
              git fetch origin apk-downloads
              git switch -C apk-downloads FETCH_HEAD
            else
              git switch --orphan apk-downloads
            fi
            mkdir -p "$TAG"
            cp "$RUNNER_TEMP/BalanceHub.apk" "$TAG/BalanceHub.apk"
            cp "$RUNNER_TEMP/notes.md" "$TAG/README.md"
            git add "$TAG"
            git commit -m "Publish fully verified BalanceHub $TAG signed APK"
            git push origin HEAD:refs/heads/apk-downloads
            actual="$(gh api "repos/$GITHUB_REPOSITORY/contents/$TAG/BalanceHub.apk?ref=apk-downloads" --jq .size)"
            test "$actual" -gt 9000000
            echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/apk-downloads/$TAG/BalanceHub.apk" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
