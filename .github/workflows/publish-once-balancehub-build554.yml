name: Publish verified BalanceHub build 554 APK

on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - ".github/workflows/publish-once-balancehub-build554.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.repository == 'RussoTurissto/BalanceHub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "43481346150"
      SOURCE_SHA: "f5c177f3d49f7052d72042e738ddef94c0f2c695"
      TAG: "v1.1.3-rc3-build554"
      CODE: "554"
      VERSION: "1.1.3-rc3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source run and obtain its signed APK
        shell: bash
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          if [[ "$conclusion" != success || "$sha" != "$SOURCE_SHA" ]]; then
            echo "::error::The approved signed APK was not built from the expected source"
            exit 1
          fi
          mkdir -p dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name BalanceHub --dir dist
          test -s dist/BalanceHub.apk
      - name: Reverify installable package and APK signature
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs dist/BalanceHub.apk | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          "$tools/aapt" dump badging dist/BalanceHub.apk | tee "$RUNNER_TEMP/package.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app'" "$RUNNER_TEMP/package.txt"
          grep -q "versionName='$VERSION'" "$RUNNER_TEMP/package.txt"
          grep -q "versionCode='$CODE'" "$RUNNER_TEMP/package.txt"
          sha256sum dist/BalanceHub.apk
      - name: Publish public GitHub Release with direct APK
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; not overwriting user downloads"
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## BalanceHub 1.1.3-rc3 — сборка 554

          Это новая тестовая сборка с исправлениями архива событий и уведомлений.

          - Архив событий оформлен и работает как архив платежей: отдельный экран, раскрываемые карточки, восстановление и удаление
          - Выбор 15 встроенных звуков в настройках «Обновления», «Платежи», «События»
          - Включение вибрации и восстановление звуков ранее беззвучных каналов с согласия пользователя
          - Тестовые уведомления для проверки реального поведения Android
          - Проверены компиляция Kotlin, Android Lint, модульные тесты и APK-подпись в GitHub Actions

          **Это предрелиз:** фактическую работу звука и вибрации нужно проверить на телефоне. Режим «Не беспокоить» и системные разрешения Android сохраняют приоритет.

          Скачайте `BalanceHub.apk` ниже и установите поверх текущей версии **без предварительного удаления приложения**, чтобы сохранить данные. 

          APK: версия 1.1.3-rc3, Android versionCode 554, собран из `f5c177f3d49f7052d72042e738ddef94c0f2c695`.
          NOTES
          if gh release create "$TAG" "dist/BalanceHub.apk#BalanceHub.apk" \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "BalanceHub 1.1.3-rc3 — сборка 554" \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false; then
            echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BalanceHub.apk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publish failed; trying public isolated APK downloads branch"
            cp dist/BalanceHub.apk "$RUNNER_TEMP/BalanceHub.apk"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git ls-remote --exit-code --heads origin apk-downloads >/dev/null 2>&1; then
              git fetch origin apk-downloads
              git switch -C apk-downloads FETCH_HEAD
            else
              git switch --orphan apk-downloads
            fi
            mkdir -p "$TAG"
            cp "$RUNNER_TEMP/BalanceHub.apk" "$TAG/BalanceHub.apk"
            git add "$TAG/BalanceHub.apk"
            git commit -m "Publish verified BalanceHub build 554 direct APK"
            git push origin HEAD:refs/heads/apk-downloads
            actual="$(gh api "repos/$GITHUB_REPOSITORY/contents/$TAG/BalanceHub.apk?ref=apk-downloads" --jq .size)"
            test "$actual" -gt 9000000
            echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/apk-downloads/$TAG/BalanceHub.apk" >> "$GITHUB_STEP_SUMMARY"
          fi
