name: Publish approved BalanceHub 1.1.0
on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - ".github/workflows/publish-approved-balancehub-1.1.0.yml"

permissions:
  contents: write

concurrency:
  group: balancehub-release-1-1-0
  cancel-in-progress: false

jobs:
  approved-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_BALANCEHUB_KEYSTORE_PATH: ${{ runner.temp }}/balancehub-upload.jks
      ORG_GRADLE_PROJECT_BALANCEHUB_KEYSTORE_PASSWORD: ${{ secrets.BALANCEHUB_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_BALANCEHUB_KEY_ALIAS: ${{ secrets.BALANCEHUB_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_BALANCEHUB_KEY_PASSWORD: ${{ secrets.BALANCEHUB_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout owner-approved source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Refuse overwriting an existing release
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "::error::v1.1.0 already exists; refusing automatic replacement"
            exit 1
          fi
      - name: Restore original production signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BALANCEHUB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing production keystore secret}"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/balancehub-upload.jks"
          chmod 600 "$RUNNER_TEMP/balancehub-upload.jks"
      - name: Compile, lint and test
        run: ./gradlew --no-daemon --console=plain :app:compileReleaseKotlin :app:lintRelease :app:testDebugUnitTest
      - name: Build owner-approved release APK
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleRelease \
            -PAPP_VERSION_CODE=196 -PAPP_VERSION_NAME=1.1.0
      - name: Verify package version and production certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apk-signature.txt"
          "$BT/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-info.txt"
          grep -q "^package: name='com.github.russoturissto.buttonapp.app'" "$RUNNER_TEMP/apk-info.txt"
          grep -q "versionCode='196'" "$RUNNER_TEMP/apk-info.txt"
          grep -q "versionName='1.1.0'" "$RUNNER_TEMP/apk-info.txt"
          APK_SHA="$(sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          KEY_SHA="$(keytool -list -v -keystore "$RUNNER_TEMP/balancehub-upload.jks" -alias "$ORG_GRADLE_PROJECT_BALANCEHUB_KEY_ALIAS" -storepass "$ORG_GRADLE_PROJECT_BALANCEHUB_KEYSTORE_PASSWORD" | sed -n 's/.*SHA256: //p' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$APK_SHA" ] || [ -z "$KEY_SHA" ] || [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::APK is not signed by the existing release certificate"
            exit 1
          fi
          echo "Existing release signing certificate verified"
          sha256sum "$APK"
          cp "$APK" BalanceHub.apk
      - name: Publish only approved public release
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.txt" <<'NOTES'
          BalanceHub 1.1.0 — обновление после предварительного тестирования.

          - Главная: сводка и календарь без дублирующих списков.
          - События: сворачиваемый список, корректная архивация просроченных событий и повторения.
          - Сбербанк: информационное окно вместо перехода в настройки.
          - Платежи: единый стиль и подпись раздела.
          - Уведомления: точные будильники при наличии системного разрешения, восстановление расписания, диагностика платежей и событий.
          - Звуки: 15 улучшенных сигналов, корректное использование канала громкости уведомлений.

          Обновление устанавливается поверх прежнего BalanceHub без удаления данных.

          <!-- BalanceHub-VersionCode: 196 -->
          NOTES
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "::error::Release appeared concurrently; refusing to overwrite"
            exit 1
          fi
          gh release create v1.1.0 BalanceHub.apk \
            --target "$GITHUB_SHA" --title "BalanceHub 1.1.0" \
            --notes-file "$RUNNER_TEMP/notes.txt" --latest
      - name: Verify published release and APK asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.1.0 --json isDraft,isPrerelease,assets,url \
            --jq 'select(.isDraft == false and .isPrerelease == false and (.assets | any(.name == "BalanceHub.apk"))) | .url' | tee "$RUNNER_TEMP/public-url"
          test -s "$RUNNER_TEMP/public-url"
