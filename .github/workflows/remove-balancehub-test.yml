name: Remove obsolete BalanceHub Test prerelease
on:
  push:
    branches:
      - feature/balancehub-foundation
    paths:
      - ".github/workflows/remove-balancehub-test.yml"

permissions:
  contents: write

jobs:
  remove-obsolete-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only the superseded preview release and its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.1.0-test.6"
          if gh release view "$TAG" --json isPrerelease,tagName > "$RUNNER_TEMP/old-release.json" 2>/dev/null; then
            jq -e --arg tag "$TAG" '.isPrerelease == true and .tagName == $tag' "$RUNNER_TEMP/old-release.json"
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Obsolete preview release is still present"
            exit 1
          fi
          echo "Obsolete preview release removed or already absent."
